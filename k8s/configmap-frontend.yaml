apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: default
data:
  # App Behavior Mode (dev | prod)
  # 'dev' enables "Skip Backend" button and Mock Data fallback
  # 'prod' hides demo shortcuts and enforces real API connections
  VITE_APP_MODE: "prod"

  # Backend Connection Details
  VITE_API_HOST: "https://api.puneetdevops.online"

  # Admin Security
  VITE_ADMIN_PIN: "525127948"

  # Feature Flags (Self-documenting details for the user)
  # ------------------------------------------------------
  # ENABLE_KIDS_MODE: Toggles availability of the Kids profile (true/false)
  VITE_ENABLE_KIDS_MODE: "true"
  
  # ENABLE_VAULT: Toggles the "Personal Vault" storage feature (true/false)
  VITE_ENABLE_VAULT: "true"

  # THEME_COLOR: Global primary accent (default: #E50914)
  VITE_THEME_COLOR: "#E50914"

  # ANALYTICS_ENABLED: Enable/Disable tracking (true/false)
  VITE_ANALYTICS_ENABLED: "false"
