# ==============================================================
# AZURE FILE SHARE STORAGE CONFIGURATION
# ==============================================================

# 1. StorageClass for Azure File (Requires CSI driver installed)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-csi-premium
provisioner: file.csi.azure.com
allowVolumeExpansion: true
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=0
  - gid=0
  - mfsymlinks
  - cache=strict
  - nosharesock
  - actimeo=30
parameters:
  skuName: Premium_LRS

---

# 2. Secret for Azure Storage Account (Placeholder)
# Note: User must run: 
# kubectl create secret generic azure-secret --from-literal=azurestorageaccountname=NAME --from-literal=azurestorageaccountkey=KEY
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-account
type: Opaque
data:
  azurestorageaccountname: PLACEHOLDER_EXT_BASE64  # REPLACE ME
  azurestorageaccountkey: PLACEHOLDER_EXT_BASE64   # REPLACE ME

---

# 3. PersistentVolumeClaim (PVC) for User Vault
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: personal-vault-pvc
spec:
  accessModes:
    - ReadWriteMany  # Permits multiple pods to share the same file share
  storageClassName: azurefile-csi-premium
  resources:
    requests:
      storage: 100Gi  # Adjust size as needed for your videos/images
