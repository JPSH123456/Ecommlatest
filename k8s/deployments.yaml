apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-sql-config
data:
  ACCEPT_EULA: "Y"
  MSSQL_PID: "Developer"
  DB_SERVER: "sqlserver-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: ms-sql-secret
type: Opaque
data:
  # SuperSecretPassword123! base64 encoded
  MSSQL_SA_PASSWORD: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
  DB_PASSWORD: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
---
# Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        envFrom:
        - configMapRef:
            name: ms-sql-config
        - secretRef:
            name: ms-sql-secret
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
spec:
  ports:
  - port: 1433
    targetPort: 1433
  selector:
    app: sqlserver
---
# Example: Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: ms-sql-config
        - secretRef:
            name: ms-sql-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: auth-service
---
# Example: API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: api-gateway
---
# (Note: For brevity, similar deployments exist for user-service, product-service, cart-service, order-service, payment-service, review-service, wishlist-service. Follow the auth-service template)
